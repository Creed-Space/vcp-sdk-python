[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcp-sdk"
version = "0.8.0"
description = "Value Context Protocol SDK — portable AI ethics validation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Creed Space", email = "hello@creed.space"},
]
keywords = ["ai", "ethics", "values", "alignment", "safety", "vcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://valuecontextprotocol.org"
Repository = "https://github.com/Creed-Space/vcp-sdk-python"
Documentation = "https://valuecontextprotocol.org/docs/"

[project.scripts]
vcp = "vcp.hub.cli:main"
vcp-mcp = "vcp.mcp_server:main"

[project.optional-dependencies]
jsonschema = ["jsonschema>=4.0"]
hub = ["cryptography>=42.0", "jsonschema>=4.0", "PyYAML>=6.0"]
mcp = ["mcp>=1.8,<2"]
dev = [
    "pytest>=7.0",
    "coverage[toml]>=7.0",
    "jsonschema>=4.0",
    "cryptography>=42.0",
    "PyYAML>=6.0",
    "mcp>=1.8,<2",
    "ruff>=0.8",
    "mypy>=1.10",
    "types-jsonschema",
    "types-PyYAML",
    "build>=1.0",
    "twine>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/vcp"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["vcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
