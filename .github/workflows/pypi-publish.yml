name: Publish to PyPI

# Trusted Publishing (OIDC): no stored PyPI token. Configure once on pypi.org:
# project vcp-sdk -> Publishing -> add a GitHub publisher for
# Creed-Space/vcp-sdk-python, workflow pypi-publish.yml, environment pypi.
# Runs when a GitHub release is published; the release tag must match the
# package version (v0.9.0 for 0.9.0).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "v$version" || { echo "release tag $TAG does not match version $version"; exit 1; }
      - name: Test
        run: |
          python -m pip install -e '.[dev]'
          pytest -q
      - name: Build
        run: |
          python -m pip install build==1.3.0
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
