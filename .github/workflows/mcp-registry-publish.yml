name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry using GitHub Actions OIDC.
# OIDC from this repo grants the io.github.Creed-Space/* namespace (the registry
# grants the repository owner's namespace to Actions runs — no user token needed).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned release + sha256 (from the release's registry_<ver>_checksums.txt):
      # this binary runs with the repo's OIDC publishing identity, so it must
      # not float with "latest". Bump deliberately, updating both lines.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sSL -o mcp-publisher_linux_amd64.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
